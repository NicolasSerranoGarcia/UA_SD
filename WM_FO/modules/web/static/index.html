<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WM_FO - Operator #{{ operator_id }}</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        
        .flux-val { font-size: 2.5rem; font-weight: bold; color: #38bdf8; margin: 10px 0; text-align: center; }
        .volume-val { font-size: 1.2rem; color: #4ade80; text-align: center; margin-bottom: 10px;}
        
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; display: inline-block; }
        .st-Available { background: #22c55e; color: #000; } 
        .st-Watering { background: #22c55e; color: #000; animation: blinker 1s linear infinite; } 
        .st-Leak { background: #ef4444; color: #fff; } 
        .st-Out { background: #f97316; color: #fff; } 
        .st-Disconnected { background: #6b7280; color: #fff; }

        @keyframes blinker { 50% { opacity: 0.5; } }

        .form-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 8px; border-radius: 4px; width: 100%; }
        button { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button.btn-danger { background: var(--danger); } 
        button.btn-success { background: var(--success); } 
        
        /* NUEVOS ESTILOS PARA LOS BOTONES */
        button.btn-darkblue { background: #1e3a8a; color: white; }
        button.btn-orange { background: #f97316; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; } th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        .log-box { max-height: 250px; overflow-y: auto; background: #0f172a; padding: 10px; font-family: monospace; font-size: 0.9rem; }
        .log-SUCCESS { color: #4ade80; } .log-ERROR { color: #f87171; } .log-INFO { color: #93c5fd; } .log-ALERT { color: #facc15; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div><h2 style="margin:0;">Field Operator #<span id="op_id">{{ operator_id }}</span></h2></div>
        <div id="served-indicator" class="badge st-Disconnected">Unassigned</div>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Live Telemetry</h3>
            <div style="padding:15px; background:#0f172a; border:1px solid #3b82f6; border-radius:6px; margin-bottom:15px;">
                <div style="display:flex; justify-content: space-between;">
                    <div id="tele-station" style="color:var(--muted);">No station selected</div>
                    <div id="tele-operator" style="color:var(--muted); font-size:0.9rem;"></div>
                </div>
                <div id="tele-flux" class="flux-val">-- L/min</div>
                <div id="tele-volume" class="volume-val">Acc. Vol: -- L</div>
                <div id="tele-time" style="color:var(--muted); font-size:0.8rem; text-align:center;">Waiting for data...</div>
            </div>
            <div id="summary-container" style="display:none; background:#064e3b; padding:10px; border-radius:6px; margin-bottom:15px;">
                <strong>Last Summary:</strong> <span id="summary-text"></span>
            </div>
            
            <h3>Actions</h3>
            <div class="form-group">
                <input type="number" id="station_id" placeholder="Station ID" min="1">
                <input type="number" id="duration" placeholder="Duration(s) (empty=indef)" min="1">
                <button class="btn-success" onclick="sendAction('IRRIGATION')">Irrigate</button>
            </div>
            <div class="form-group">
                <button class="btn-orange" style="width:33%" onclick="sendAction('BLOCK')">Block</button>
                <button class="btn-warning" style="width:33%" onclick="sendAction('ACTIVATE')">Activate</button>
                <button class="btn-danger" style="width:33%; background:#7f1d1d;" onclick="sendAction('STOP')">Stop</button>
            </div>

            <h3 style="margin-top:20px;">Batches</h3>
            <div class="form-group">
                <input type="file" id="batch_file" accept=".txt">
                <button onclick="runFile()">Execute File</button>
            </div>
            <div class="form-group">
                <textarea id="batch_text" rows="2" placeholder="Or paste lines (e.g., 1#60 or 1 for indef)"></textarea>
                <button onclick="runBatchText()">Send Batch</button>
            </div>
        </div>
        <div class="card">
            <h3>Stations</h3>
            <table>
                <thead><tr><th>ID</th><th>Location</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="stations-tbody"></tbody>
            </table>
            <h3 style="margin-top:20px;">Logs</h3>
            <div class="log-box" id="logs-box"></div>
        </div>
    </div>
    <script>
        const opId = document.getElementById('op_id').innerText;

        function fmt(value, decimals) {
            const n = Number(value);
            return Number.isFinite(n) ? n.toFixed(decimals) : '--';
        }

        async function updateDashboard() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                
                const badge = document.getElementById('served-indicator');
                if (state.station_served !== null) {
                    badge.textContent = `WS-${state.station_served}` + (state.irrigating ? ' (Watering)' : ' (Available)');
                    badge.className = 'badge ' + (state.irrigating ? 'st-Watering' : 'st-Available');
                    document.getElementById('tele-station').textContent = `WS-${state.station_served}`;
                    
                    // Show Operator ID during watering[cite: 6]
                    document.getElementById('tele-operator').textContent = state.irrigating ? `Operator: FO-${opId}` : '';
                    
                    document.getElementById('tele-flux').textContent = `${fmt(state.current_flux ?? 0, 1)} L/min`;
                    
                    // Show Accumulated Volume[cite: 6]
                    document.getElementById('tele-volume').textContent = state.irrigating ? `Acc. Vol: ${fmt(state.accumulated_volume, 1)} L` : '';

                    document.getElementById('tele-time').textContent = state.last_telemetry_ts || 'Waiting...';
                }
                if (state.last_summary) {
                    const s = state.last_summary;
                    document.getElementById('summary-container').style.display = 'block';
                    document.getElementById('summary-text').innerHTML = `WS-${s.station_id} | Time: ${s.total_time_label} | Liters: ${s.total_liters}L | Avg Flux: ${s.avg_flux}L/min`;
                }
                if (state.stations.length > 0) {
                    document.getElementById('stations-tbody').innerHTML = state.stations.map(st => {
                        // Handle 'Out of service' properly for CSS class
                        let stClass = st[2];
                        if (st[2] === "Out of service") stClass = "Out";

                        let displayStatus = st[2];
                        if (st[2] === "Out of service") displayStatus = "Out of Service"; // Match rubric[cite: 6]

                        return `<tr><td>WS-${st[0]}</td><td>${st[1]}</td><td><span class="badge st-${stClass}">${displayStatus}</span></td>
                        <td><button onclick="document.getElementById('station_id').value=${st[0]}">Sel</button></td></tr>`;
                    }).join('');
                }
                document.getElementById('logs-box').innerHTML = state.logs.map(l => `<div class="log-${l.level}">[${l.time}] ${l.message}</div>`).join('');
            } catch (e) {
                console.error("Error fetching state:", e);
                // Connection lost handling[cite: 7]
                document.getElementById('logs-box').innerHTML = `<div class="log-ERROR">[!] Error connecting to WM_FO backend.</div>` + document.getElementById('logs-box').innerHTML;
            }
        }
        async function sendAction(type) {
            const station_id = parseInt(document.getElementById('station_id').value);
            const dur_val = document.getElementById('duration').value;
            const duration = dur_val ? parseInt(dur_val) : null;
            if (!station_id) return alert('Enter an ID.');
            
            try {
                await fetch('/api/command', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({type, station_id, duration}) });
                updateDashboard();
            } catch (e) {
                alert("Impossible to connect with WM_Central"); // Error handling[cite: 7]
            }
        }
        async function postBatch(content) {
            try {
                const res = await fetch('/api/batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });
                if (!res.ok) alert('Invalid batch format. Expected one line per command: station_id[#duration]');
                updateDashboard();
            } catch (e) {
                alert("Impossible to connect with WM_FO backend");
            }
        }
        async function runFile() {
            const file = document.getElementById('batch_file').files[0];
            if (!file) return alert('Select a file first.');
            const content = (await file.text()).trim();
            if (content) await postBatch(content);
        }
        async function runBatchText() {
            const content = document.getElementById('batch_text').value.trim();
            if (content) await postBatch(content);
        }
        setInterval(updateDashboard, 1000); updateDashboard();
    </script>
</body>
</html>
