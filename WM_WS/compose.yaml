services:
  engine:
    build:
      context: .
      dockerfile: WM_WS_E/Dockerfile
    environment:
      QUEUE_ENDPOINT: "${QUEUE_ENDPOINT:-iriguchi.proxy.rlwy.net:37040}"
      STATE_FILE: /var/lib/wm-ws/state.jsonl
      LOG_FILE: /var/log/wm-ws/wm-ws-engine.log
    volumes:
      - engine-state:/var/lib/wm-ws
      - station-logs:/var/log/wm-ws
    stdin_open: true
    tty: true

  monitor:
    build:
      context: .
      dockerfile: WM_WS_M/Dockerfile
    environment:
      WS_ID: "${WS_ID:-1}"
      ENGINE_HOSTNAME: engine
      ENGINE_PORT: "8080"
      CENTRAL_HOSTNAME: "${CENTRAL_HOSTNAME:-altaria.proxy.rlwy.net}"
      CENTRAL_PORT: "${CENTRAL_PORT:-40931}"
      LOG_FILE: /var/log/wm-ws/wm-ws-monitor.log
    volumes:
      - station-logs:/var/log/wm-ws
    stdin_open: true
    tty: true

volumes:
  engine-state:
  station-logs:
